# Marshal instance configuration. Keys are camelCase; environment variables override them
# (MARSHAL__Section__Key). Never put secret values here — only secret names (keys ending in "Secret").

instance:
  timeZone: Europe/Vienna   # IANA id; new users start with it (unset: Home Assistant's time zone, else UTC)

# Home Assistant (optional). The token is a long-lived access token of an admin user (the exposure list needs
# admin); the same secret authenticates the HA MCP server in mcp/ha.yaml.
# ha:
#   url: http://homeassistant.local:8123
#   tokenSecret: ha_token

# 3D printers via Moonraker (optional). apiKeySecret is only needed when Moonraker requires an API key.
# macros is the allowlist for printer.run_macro (no arguments are ever passed). Snapshots are stored under
# /data/snapshots.
# printers:
#   - name: voron
#     url: http://voron.local:7125
#     webUrl: http://voron.local           # Mainsail / Fluidd, linked for actions Marshal does not offer
#     apiKeySecret: moonraker_voron
#     macros: [PARK, LOAD_FILAMENT, UNLOAD_FILAMENT]
#     babysitter: { enabled: true, interval: "00:01:00" }   # snapshot checks during prints; pauses after two failed ones
# printerSnapshots: { maxSize: 1024, quality: 85, retention: 20 }

# FreshRSS (optional). The API password is set in FreshRSS under Profile → API management.
# freshrss:
#   url: http://freshrss.local
#   userName: lukas
#   apiPasswordSecret: freshrss_api
#   searchWindow: 500                              # recent articles rss.search looks through
#   fullText: { maxBytes: 2097152, timeout: "00:00:15", maxCharacters: 20000 }

# Web search through your own SearXNG (optional). Enable JSON in SearXNG's settings.yml (search.formats: [html, json])
# and keep it on the LAN or a VPN. Query text reaches every engine listed; result pages are never opened.
# web:
#   searxng:
#     url: http://searxng.local:8080
#     authHeaderSecret: searxng_auth                 # optional Authorization header value, for a reverse proxy
#     engines: [google, bing, duckduckgo, wikipedia]
#     maxResults: 8

# Notes (optional): Markdown files in a git repository. Without a remote, put a repository into /data/notes; with
# one, Marshal clones it there and mirrors it read-only. credentialSecret holds an https token or an SSH deploy key.
# notes:
#   remote: https://git.example.com/lukas/notes.git
#   branch: main
#   credentialSecret: notes_token
#   pullInterval: "00:15:00"

# OAuth clients for connecting mail accounts in the web UI (optional; without one the connect button is disabled).
# Register the redirect URI <public URL>/oauth/callback/google (or /microsoft) with the provider. Google needs the
# https://mail.google.com/ scope, Microsoft IMAP.AccessAsUser.All and offline_access.
# oauth:
#   google: { clientId: "123.apps.googleusercontent.com", clientCredentialSecret: google_oauth_client }
#   microsoft: { clientId: "00000000-0000-0000-0000-000000000000", clientCredentialSecret: microsoft_oauth_client }

owner:                      # the instance owner created on first start
  displayName: "Your name"
  language: en              # de | en

http:
  pathBase: ""              # e.g. /marshal behind a reverse proxy

auth:
  providers:                # several may be active at once
    - name: local           # passkeys + password; first-run setup claims the instance owner
      type: local
    # - name: authentik     # redirect URI at the IdP: https://<host>/signin-oidc/authentik
    #   type: oidc
    #   displayName: Authentik
    #   authority: "https://auth.example.com/application/o/marshal/"
    #   clientId: marshal
    #   clientCredentialSecret: authentik_client   # secret name, not the value
    #   scopes: [openid, profile, email]
    #   claims: { subject: sub, name: name, groups: groups }
    #   roleMappings:       # IdP group -> admin | user; logins without a mapped group are denied
    #     marshal-admins: admin
    #     marshal-users: user

models:
  fast:
    tier: fast
    provider: ollama
    model: "qwen3:8b"
    endpoint: "http://ollama:11434"
    contextLength: 32768
  standard:
    tier: standard
    provider: ollama
    model: "qwen3:30b"
    endpoint: "http://ollama:11434"
    contextLength: 32768
    reasoning: "off"                    # off | low | medium | high: text turns and background runs think first;
                                        # voice turns never do. The web chat shows the reasoning.
  # advisor:
  #   tier: advisor
  #   provider: anthropic
  #   model: claude-sonnet-4-5
  #   apiKeySecret: anthropic_key       # file /run/secrets/anthropic_key or MARSHAL_SECRET_ANTHROPIC_KEY
  #   contextLength: 200000
  #   price: { inputPerMTok: 3, outputPerMTok: 15, cachedPerMTok: 0.3 }
  # local:
  #   tier: standard
  #   provider: openai-compatible        # llama.cpp llama-server, vLLM, LM Studio
  #   model: "qwen3"
  #   endpoint: "http://llama:8080/v1"

# Embedding model for memory. Must be multilingual (bge-m3, multilingual-e5, nomic-embed-text-v2), otherwise a German
# question misses an English memory. Changing it re-embeds all memory at the next start.
embedding:
  provider: ollama                     # ollama or openai-compatible
  model: "bge-m3"
  endpoint: "http://ollama:11434"

# memory:
#   summarizer: { enabled: true, maxTurns: 50 }   # summarize finished conversations into memory (fast tier)
#   audit: { staleAfterDays: 180 }
#   retrieval: { tokenBudget: 600 }              # memory added to each turn's prompt

agent:
  maxSteps: 8
  voiceLatencyCap: "00:00:08"
  textLatencyCap: "00:01:00"
  maxDelegationDepth: 3     # deepest subagent level for agent.delegate
  advisor:
    maxCallsPerRun: 2
    dailyCostCap: 1.0

# Tool retrieval: only the core namespaces plus the namespaces a session needs reach the model.
tools:
  core: [agent, memory, tasks, notifications, timers, places]
  retrieval:
    enabled: true
    threshold: 0.30         # cosine similarity turn ↔ namespace description; depends on the embedding model
    maxPerTurn: 3
    minTools: 24            # skip retrieval when this few tools are visible anyway

voice:
  fillerThresholdMs: 700    # speak a tool's filler line first when it usually takes longer

confirmation:
  ttl: "00:01:00"
  judgeTimeout: "00:00:03"
  keywords:
    en: [confirm, confirmed, approved, "yes do it"]
    de: [bestätigt, bestätigen, "ja mach", "ja mach das"]

sessions:
  idleTtl: "00:05:00"

tasks:
  workers: 2                # background task runs at the same time
  approvalTtl: "00:10:00"   # background approvals expire (as rejected) after this

aiTasks:                    # Home Assistant AI Task entity (POST /api/v1/ai-tasks, token scope aitasks:write)
  timeoutSeconds: 60        # a task still running after this is cancelled (504); HA waits a little longer
  maxAttachments: 4         # images per task (JPEG, PNG, WebP)
  maxAttachmentBytes: 10485760  # per image, at most 25 MB; tasks with images need a vision model in the template's tier

maintenance:                # system tasks, seeded for the instance owner (cron in the owner's time zone)
  backupSchedule: "0 3 * * *"         # database copy + /data/keys + memory exports into /data/backups/<stamp>
  backupCopies: 7
  consolidationSchedule: "30 2 * * *" # memory summaries of the day's closed sessions the close path missed
  retentionSchedule: "30 3 * * *"
  payloadRetention: "30.00:00:00"     # full run step payloads
  metadataRetention: "365.00:00:00"   # runs and their step metadata

notifications:
  quietHoursMode: hold      # hold (deliver when quiet hours end) or silentPush
  coalesceWindow: "00:02:00"  # normal notifications within this window become one message
  sourceVoiceInterval: "00:30:00"  # at most one voice notification per source in this interval
  voicePerHour: 6           # beyond this, voice notifications are pushed
  followUpReplyWindow: "00:00:20"  # a voice turn this soon after a spoken question from the same satellite answers it
  # publicUrl: https://marshal.example.com/   # push notifications link into the web UI

# artifacts_inspect looks at a 3D model, image or code page with a vision model (a model with vision: true in the
# run's tier or in standard); rendered 3D pages are cached in /data/cache/renditions (at most 512 MB, disposable).
artifacts:                  # files in /data/artifacts: uploads, executor output, kept snapshots, saved attachments
  quotaMb: 5120             # storage per user
  maxUploadMb: 200          # largest single file
  signedLinkMinutes: 15     # lifetime of signed content links (e.g. for a phone notification)

# Screens (Home Assistant media players, e.g. a TV through the DLNA Digital Media Renderer integration) on which
# artifacts_show plays images, MP4 video, 3D models (STL, 3MF: a shaded view, then front/right/top views) and
# code / diff / Markdown as PNG pages. A satellite shows on the display
# named in its satellites.yaml profile (display: living_tv). The TV fetches the media itself, so mediaBaseUrl must be
# an address the TV reaches: DLNA renderers prefer plain HTTP and an IP address, so publish Marshal's HTTP port on the
# LAN (e.g. ports: ["8080:8080"] in docker-compose.yml). An https URL with a certificate the TV trusts works too.
# Without mediaBaseUrl, notifications.publicUrl is used.
displays:
  # mediaBaseUrl: http://192.168.1.10:8080/
  linkMinutes: 240          # lifetime of display links; long enough to pause a video
  surfaces: {}
  #   living_tv: { entity: media_player.living_room_tv }

# Inbound webhooks (POST /api/v1/hooks/<source>), published on the event bus for watches. Sources are code;
# the first is uptime-kuma. Each source needs a token with its own scope, e.g. for Uptime Kuma:
#   1. marshal tokens create --name kuma --scope hooks:uptime-kuma
#   2. Uptime Kuma: Settings > Notifications > Setup Notification > Webhook,
#      Post URL https://<marshal>/api/v1/hooks/uptime-kuma, Request Body "application/json" (or form-data),
#      Additional Headers {"Authorization": "Bearer <token>"}
#   3. Create a watch, e.g. "tell me when the NAS goes down" (source uptime-kuma, type monitor.down, entity NAS).
#
# Proxmox VE (8.3+) sends backup, replication, fencing and package-update notifications the same way:
#   1. marshal tokens create --name proxmox --scope hooks:proxmox
#   2. Proxmox: Datacenter > Notifications > Add > Webhook
#        Method/URL: POST https://<marshal>/api/v1/hooks/proxmox
#        Headers:    Authorization = Bearer {{ secrets.token }}    Content-Type = application/json
#        Body:       {"severity":"{{ severity }}","timestamp":{{ timestamp }},"fields":{{ json fields }}}
#        Secrets:    token = <the token from step 1>
#      and a notification matcher that sends to it. Events: backup.failed, backup.ok, replication.failed,
#      node.fenced, updates.available (entity: the backup job id, else the node name).
#
# Seerr sends request notifications (the example watch tasks/media-available.yaml pushes "now available"):
#   1. marshal tokens create --name seerr --scope hooks:seerr
#   2. Seerr: Settings > Notifications > Webhook
#        Webhook URL:          https://<marshal>/api/v1/hooks/seerr
#        Authorization Header: Bearer <the token from step 1>
#        JSON Payload:         {"notification_type":"{{notification_type}}","{{media}}":{"media_type":"{{media_type}}","tmdbId":"{{media_tmdbid}}","status":"{{media_status}}","jellyfinMediaId":"{{media_jellyfinMediaId}}"},"{{request}}":{"request_id":"{{request_id}}"}}
#        Notification Types:   Request Approved, Request Automatically Approved, Request Available,
#                              Request Declined, Request Failed
#      Events: media.approved, media.available, media.declined, media.failed (entity: movie:<tmdb id> or tv:<tmdb id>).
webhooks:
  debounceSeconds: 60       # a repeat of the same event (type and monitor) within this window is dropped
  requestsPerMinute: 60     # per token; more get 429

# Read-only Proxmox VE access for the infra.* tools (overview, guests, storage, tasks); hidden until url is set.
# Create the token in Proxmox (Datacenter > Permissions > API Tokens, privilege separation on) and give it only
# the PVEAuditor role on "/". Marshal sends GET requests only.
# proxmox:
#   url: https://pve.lan:8006/
#   tokenId: marshal@pve!marshal
#   tokenSecret: proxmox_token              # secret name; the value (a UUID) lives in /run/secrets or the database
#   certificateFingerprint: "AB:CD:..."     # SHA-256 of the node's self-signed certificate (Node > System > Certificates)

# Media requests for the media.* tools: search and request titles through Seerr (requests need confirmation),
# upcoming episodes and downloads from Sonarr and Radarr (optional, read only), links to the Jellyfin web client
# (optional). Hidden until seerr.url is set. Seerr's API key belongs to its admin; Marshal only reads and creates
# requests. Sonarr and Radarr keys are full-access (neither has read-only keys): Marshal sends GET requests only, but
# keep the services on the LAN and the keys in secrets.
# media:
#   seerr:  { url: https://seerr.lan/,  apiKeySecret: seerr_api_key }
#   sonarr: { url: https://sonarr.lan/, apiKeySecret: sonarr_api_key }
#   radarr: { url: https://radarr.lan/, apiKeySecret: radarr_api_key }
#   jellyfinUrl: https://jellyfin.lan/

# Music through Music Assistant (optional; needs ha.url and the Music Assistant integration in Home Assistant). Each
# speaker name maps to a Music Assistant media_player entity; the music_* tools take these names only, and a
# satellite plays on the speaker named in its satellites.yaml profile (speaker: kitchen). Do not expose the Music
# Assistant players to Assist: HA's own media intents then offer a second way to pause or play the same speaker, and
# small models pick between the two at random.
# music:
#   speakers:
#     kitchen:     media_player.kitchen_satellite_ma   # the satellite's own Music Assistant player
#     living_room: media_player.living_room_sonos

# Read-only GitHub access for the repos.* tools (pull requests, issues, CI runs and failed-job logs); hidden until
# repos are listed. The model sees only these ids, never other repositories. Use a fine-grained personal access token
# limited to these repositories with read-only Metadata, Contents, Pull requests, Issues and Actions permissions.
# It expires (at most one year): replace the secret value, no restart needed. Keep the executor's git token separate.
# Diffs and failed-job logs are stored as artifacts (source github, tainted); everything the tools return is
# third-party text and taints the run.
# github:
#   tokenSecret: github_pat                 # secret name; the value lives in /run/secrets or the database
#   repos:
#     marshal: lukas/marshal                # id the model uses: owner/name on GitHub
#     homelab: lukas/homelab

# Coding sessions on the separate executor host (src/Marshal.ExecutorHost); tasks.run_executor is hidden until set.
# executors:
#   callbackBaseUrl: http://marshal:8080/     # Marshal as seen from the executor host
#   claudeCode:
#     url: http://executor-host:8080/
#     tokenSecret: executor_host_token        # secret name; the value lives in /run/secrets or the database
#     repositories:
#       - name: marshal                       # directory below the host's repositoriesRoot
#         description: this project

recording:
  redactTools: []           # tool id globs stored as references only (tools flagged sensitive always are)
  keepContentTools: []

# telemetry:
#   otlpEndpoint: "http://otel-collector:4317"
#   captureContent: false   # true adds inputs, tool arguments, results and replies to spans (personal data)

# Demo mode: simulates Home Assistant, a printer, mail, FreshRSS and notes where they are not configured above, and
# seeds sample history (conversations, runs, tasks, notifications, an approval, memory) for the owner. Configured
# integrations stay real. A model is still required. Remove the sample data with `marshal demo reset`.
# demo:
#   enabled: true
#   showBadge: true                         # false hides the "Demo" badge, e.g. for screenshots
