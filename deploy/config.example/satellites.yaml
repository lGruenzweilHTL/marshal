# Optional per-satellite profiles, keyed by satellite entity id. Unlisted satellites use defaults.
# A convenience limit for fixed devices, not an authorization boundary. Hot-reloaded.
satellites:
  assist_satellite.kitchen:
    verbosity: short
    notes: "Cooking area. Timer and recipe questions are common."
    # display: kitchen_tv                  # a display from displays.surfaces in marshal.yaml: artifacts_show plays there
  assist_satellite.kids_room:
    verbosity: short
    denyConfirm: [printer.*, calendar.*]   # confirm-tier tools hidden here
    denyTools: [mail.*]                    # hidden entirely
