[project]
name = "marshal-ha"
version = "0.1.0"
description = "Home Assistant custom integration that forwards Assist conversations to Marshal"
requires-python = ">=3.14.2"

[dependency-groups]
dev = ["pytest-homeassistant-custom-component==0.13.367"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
