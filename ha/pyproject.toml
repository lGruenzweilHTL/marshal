[project]
name = "marshal-ha"
version = "0.1.0"
description = "Home Assistant custom integration that forwards Assist conversations to Marshal"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.367",
    # Requirements of the HA components the tests set up (conversation, assist_pipeline, tts, ai_task with camera), as pinned by HA 2026.9.4.
    "gazetteer-matcher==1.1.0",
    "hassil==3.12.1",
    "home-assistant-intents==2026.8.28",
    "pymicro-vad==1.0.1",
    "pyspeex-noise==1.0.2",
    "mutagen==1.48.1",
    "ha-ffmpeg==3.2.2",
    "PyTurboJPEG==1.8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
