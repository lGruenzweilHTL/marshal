# Test-only Dovecot settings: plaintext login from the test host, a German drafts folder marked \Drafts
# (RFC 6154) instead of the default English one, and a subscribed Sent folder for thread tests.
auth_allow_cleartext = yes
namespace inbox {
  mailbox Drafts {
    special_use =
    auto = no
  }
  mailbox Entwürfe {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
}
