name: Deploy Docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "clay.yaml"
      # The API reference is built from the committed OpenAPI document by this script
      - "web/openapi/v1.json"
      - "scripts/docs-openapi.mjs"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so pages can show when they were last updated
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # --strict fails the build on broken links, bad request cells and typos in the config
      - run: npx clay-doc@5 build --strict

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./publish/public

      - id: deployment
        uses: actions/deploy-pages@v5
