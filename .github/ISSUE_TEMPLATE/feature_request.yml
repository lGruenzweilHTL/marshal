name: Feature request
description: Suggest a new capability or an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the roadmap in docs/roadmap.md first. Marshal's design rules apply: no mail send path, no raw device commands, no secrets in `/config`.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to do that Marshal cannot do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: How should it work, from the user's point of view?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: risk
    attributes:
      label: Does it act on the outside world
      options:
        - No, read-only
        - Yes, harmless actions
        - Yes, risky actions that need confirmation
        - Not sure
